      rel="stylesheet"
    />

  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Go to home">
        <span class="brand-mark" data-brand-initials>MM</span>
        <span data-site-name>Mr. Monkey</span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="/">Home</a>
        <a href="/creations/">Creations</a>
        <a href="/videos/">YouTube</a>
        <a href="/merch/">Merch</a>
        <a href="/about/">About</a>
        <a href="/contact/">Contact</a>
      </nav>
    </header>

    <main class="merch-page">
      <header class="merch-opening">
        <div class="merch-opening-copy">
          <p class="eyebrow">Merch</p>
          <h1>Official Mr. Monkey Merch</h1>
          <p>Official Mr. Monkey merch is here. Browse the store and see what’s available.</p>
        </div>
        <img
          src="../assets/images/mr-monkey-mascot.png"
          alt="Mr. Monkey mascot"
          width="1059"
          height="1486"
        />
      </header>

      <section class="merch-store" aria-label="Official Mr. Monkey merch store">
        <p class="merch-store-note">The store and checkout are powered by Spring.</p>
        <div class="merch-product-store" data-spring-product-store hidden aria-busy="true">
          <p class="merch-product-status" data-spring-product-status role="status">
            Loading the latest products...
          </p>
          <div class="merch-product-grid" data-spring-product-grid></div>
          <div class="merch-store-actions">
            <a
              class="button merch-full-store-button"
              href="https://mr-monkeys-merch.creator-spring.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              View Full Spring Store
            </a>
            <a
              class="merch-spring-brand"
              href="https://mr-monkeys-merch.creator-spring.com/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Powered by Spring by Amaze"
            >
              <img
                src="https://embed.creator-spring.com/poweredby_grey.svg"
                alt="Powered by Spring by Amaze"
                width="126"
                height="24"
              />
            </a>
          </div>
        </div>
        <div class="spring-store-shell" data-spring-store-shell>
          <iframe
            class="spring-store-frame"
            data-spring-store
            style="border-radius:7px;border:none"
            src="https://embed.creator-spring.com/widget?slug=mr-monkeys-merch&amp;per=30&amp;currency=&amp;page=1&amp;layout=grid-sm-4&amp;theme=dark"
            title="Official Mr. Monkey merch store powered by Spring"
            width="100%"
            height="620"
            data-reactroot=""
          ></iframe>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p class="footer-note">&copy; 2026 Mr. Monkey</p>
      <div class="footer-socials" data-footer-socials aria-label="Social links"></div>
    </footer>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.1/iframeResizer.min.js"
      integrity="sha512-ngVIPTfUxNHrVs52hA0CaOVwC3/do2W4jUEJIufgZQicmY27iAJAind8BPtK2LoyIGiAFcOkjO18r5dTUNLFAw=="
      crossorigin="anonymous"
    ></script>
    <script src="../assets/js/site-data.js"></script>
    <script src="../assets/js/script.js?v=20260810-merch-grid"></script>
  </body>
</html>
